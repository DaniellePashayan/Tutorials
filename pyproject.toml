[project]
name = "api-advanced"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.157.0",
    "jwt>=1.4.0",
    "pwdlib>=0.3.1",
    "pydantic>=2.14.1",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "poethepoet>=0.49.0",
]

[tool.poe.tasks] 
api_dev = "uv run fastapi dev api/main.py"
reset_database = "uv run database/reset.py"